<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de Servidores</title>
<style id="guarda-css">html{visibility:hidden}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{-webkit-print-color-adjust:exact;print-color-adjust:exact}
html,body{height:100%}
body{font:14px "Segoe UI",Arial,sans-serif;margin:0;padding:8px;height:100vh;height:100dvh;overflow:hidden;box-sizing:border-box;color:#111;text-align:center;
  display:flex;justify-content:center;align-items:center;
  background-color:#e6ecf3;
  background-image:linear-gradient(rgba(255,255,255,.62),rgba(255,255,255,.62)),url('background.png');
  background-size:100% 100%;background-position:center;background-repeat:no-repeat;background-attachment:fixed}
.painel{background:rgba(255,255,255,.95);border-radius:8px;box-shadow:0 10px 36px rgba(0,0,0,.7);padding:12px 8px;width:100%;max-width:1400px;min-width:0;margin:0 auto;display:flex;flex-direction:column;max-height:calc(100vh - 16px);max-height:calc(100dvh - 16px)}
button{font:inherit;cursor:pointer}
.btn{padding:5px 14px;border:1px solid #888;background:#f2f2f2;border-radius:3px}
.btn:hover{background:#e6e6e6}
#st{color:#1d4e89;font-weight:600}
a.btn{color:inherit;text-decoration:none;display:inline-block}
.faixa{background:#1d4e89;color:#fff;border-radius:3px;padding:10px 14px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.fl{justify-self:start}
.fc{min-width:0}
.faixa .btn{color:#111;background:#fff;border-color:#888}
.faixa .btn:hover{background:#e6e6e6}
@media(max-width:820px){.faixa{grid-template-columns:1fr;justify-items:center}.fl{justify-self:center}}
.dias{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dias button{border:1px solid #1d4e89;background:#fff;color:#1d4e89;border-radius:99px;padding:2px 12px;text-transform:capitalize}
.dias button.on{background:#1d4e89;color:#fff}
.dias button.zero b{color:#b00020}
.dias button.on.zero b{color:#ffd0d6}
.hint{margin:0 0 8px;color:#555;font-size:.88rem;min-height:1.2em}
.wrap{flex:1;min-height:0;overflow:auto}
table{border-collapse:collapse;margin:0;width:auto;font-size:14px}
/* Tabela superior: altura fixa (8 linhas); se passar disso, rola por dentro */
.w2{flex:none;overflow:auto;margin-bottom:12px;height:230px}
#t2{width:100%;font-size:15px}
#t2 th{position:sticky;top:0;z-index:2;height:29px}
/* Tabela inferior: rolagem na própria área */
.baixo{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.ag{flex:1 1 580px;min-width:min-content}
.ag td,.ag th{padding:2px 6px}
.ag table{width:100%;font-size:12px}
.ag th.ti{background:#0086c3;border-color:#0086c3;color:#fff;font-size:16px;height:26px;padding:0 10px;position:sticky;top:0;z-index:3}
.qt{display:inline-block;margin-left:8px;padding:1px 10px;border-radius:99px;background:rgba(255,255,255,.22);font-size:12px;font-weight:600;vertical-align:2px}
#t2 th{padding:0 12px;border:0;border-left:1px solid rgba(255,255,255,.5)}
#t2 th:first-child{border-left:0}
#t2 td{text-align:left;height:24px;padding:0 6px;line-height:20px;overflow:hidden;text-overflow:ellipsis;background:#eef1f5;border:0;border-top:1px solid #d3dae3;border-left:2px solid #9db0c6}
#t2 td:first-child{border-left:1px solid #0b2545}
#t2 td:last-child{border-right:1px solid #0b2545}
#t2 tbody tr:last-child td{border-bottom:1px solid #0b2545}
#t2 td.f{box-shadow:inset 0 0 0 2px #fff}
#t2 td.f.fd{box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 9999px rgba(255,255,255,.35)}
#t2 select{width:100%;font:inherit;padding:0;margin:0;height:22px}
#ovs{position:fixed;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;z-index:50}
#ovs .dlg{background:#fff;color:#111;border-radius:6px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:270px;box-shadow:0 8px 30px rgba(0,0,0,.35)}
#ovs .dlg div{display:flex;gap:8px;justify-content:flex-end}
.sw{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid rgba(0,0,0,.3)}
.cf{display:inline-block;margin-top:4px;font-size:.85em;white-space:nowrap}
input[type=color]{width:34px;height:22px;padding:0;border:1px solid #888;vertical-align:middle;cursor:pointer;background:none}
#t2 th.fd{background:#1d4e89}
#t2 td.fd{box-shadow:inset 0 0 0 9999px rgba(255,255,255,.35)}

th,td{border:1px solid #222;padding:2px 10px;vertical-align:middle;white-space:nowrap;text-align:center}
th{background:#0b2545;color:#fff;font-weight:700;padding:5px 10px;border-color:#0b2545}
th.s{cursor:pointer;user-select:none;position:sticky;top:25px;z-index:2}
th.s:hover{background:#13315c}
.t1{font-size:1.45rem;font-weight:700}
.t2{font-size:.95rem;font-weight:700;font-style:italic;margin-top:4px}
.t2 b{font-style:normal}
tr.AJA td{background:#eaf3fc}
tr.ABT td{background:#fdf1dc}
tr.ed td{background:#fff9c4}
tbody tr:hover td{filter:brightness(.96)}
#t1 td:nth-child(1),#t1 td:nth-child(2){text-align:left}
td input,td select{font:inherit;border:1px solid #999;border-radius:3px;background:#fff;padding:3px 4px;text-align:center;width:auto}
#t1 td:nth-child(1) input,#t1 td:nth-child(2) input{text-align:left}
td select{width:100%;color:#555;margin-top:2px}
td input:focus,td select:focus{outline:2px solid #1d4e89}
.b{display:flex;justify-content:center;align-items:center;gap:6px;padding:1px 2px}
.b button{border:0;background:none;color:#b00020;font-size:1rem;line-height:1;padding:0 4px}
#menu{position:fixed;display:none;z-index:50;background:#fff;border:1px solid #999;border-radius:6px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:4px;min-width:180px;text-align:left}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-radius:4px}
#menu button:hover{background:#e8eef7}
#menu button.d{color:#b00020}
@page{size:A4 landscape;margin:10mm}
@media print{
  html,body{height:auto}
  body{display:block;padding:0;min-height:0;height:auto;overflow:visible;background:none!important}
  .painel{display:block;max-height:none;background:none;box-shadow:none;padding:0;width:auto}
  .faixa,.dias,.hint,#menu{display:none!important}
  .wrap,.w2{overflow:visible;max-height:none}
  .w2{height:auto!important}
  th.s,th.ti,#t2 th{position:static}
  .painel{zoom:.75;max-width:none}
  tbody tr:hover td{filter:none}
}
</style>
</head>
<body>
<div class="painel">
<div class="faixa">
  <div class="fl"><a class="btn" id="voltar" href="painel.html">← Voltar</a></div>
  <div class="fc"><div class="t1">Escala de Servidores</div><div class="t2">Pesquisas Econômicas Anuais - <b>AJA</b></div></div>
</div>
<div class="dias" id="dias"></div>
<p class="hint"><span id="ht"></span> <span id="st"></span></p>
<div class="w2" id="w2">
<table id="t2">
<thead>
<tr id="h2"></tr>
</thead>
<tbody id="tb2"></tbody>
</table>
</div>
<div class="wrap">
<div class="baixo">
<section class="ag"><table id="t1"><thead><tr><th class="ti" colspan="5">IBGE - AJA <span class="qt" id="qt"></span></th></tr><tr><th class="s" data-c="nome" data-l="Servidor">Servidor</th><th class="s" data-c="email" data-l="e-mail">e-mail</th><th class="s" data-c="contato" data-l="Contato">Contato</th><th class="s" data-c="siape" data-l="SIAPE">SIAPE</th><th class="s" data-c="dias" data-l="Dia Agência">Dia Agência</th></tr></thead><tbody id="tb"></tbody></table></section>
</div>
</div>
</div>
<div id="menu"></div>

<script>
const sb=supabase.createClient('https://jvjfpxrknggeodjgamyu.supabase.co','sb_publishable_yxHF_N1gjdGoHMEoM5GF2w_QVMzzMF0');
const noGit=location.hostname.endsWith("github.io");
const AG="AJA";
const DIAS=["segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira"];
const PAL=["#e377c2","#2e7d32","#f5b301","#1f77b4","#7cb342","#e8702a","#5b2a6e","#0ea5e9","#f4a582","#7b3fa0","#17806d","#c0392b","#7f8c8d","#8d6e63","#3949ab"];
const txt=c=>{const n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return(r*299+g*587+b*114)/1000>150?"#111":"#fff"};
const uid=()=>Math.random().toString(36).slice(2);
const P=(ag,nome,email,siape,dia)=>({id:uid(),ag,nome,email,siape,dias:[dia]});
const SEED=[
["AJA","Adriana Costa Braz dos Santos","adriana.braz@ibge.gov.br","3471919","terça-feira"],
["AJA","Arthur Louzada de Souza","arthur.souza@ibge.gov.br","3476717","quarta-feira"],
["AJA","Fabio Pereira Silva","fabio.pereira@ibge.gov.br","3451876","quarta-feira"],
["AJA","Gabriel Finotti dos Reis Nunes","gabriel-finotti.reis@ibge.gov.br","3373216","sexta-feira"],
["AJA","Hugo de Mello Sampaio","hugo.mello@ibge.gov.br","3476720","segunda-feira"],
["AJA","Iuri George da Silva Palmeira","iuri.palmeira@ibge.gov.br","2157841","sexta-feira"],
["AJA","Lucas Mucuri Ramos","lucas.mucuri@ibge.gov.br","3469134","sexta-feira"],
["AJA","Maury Fadel Goncalves","maury.goncalves@ibge.gov.br","3408075","segunda-feira"],
["AJA","Paulo Felipe Ferreira Tavares","paulo-felipe.tavares@ibge.gov.br","3495437","quinta-feira"],
["AJA","Romenig Oliveira Candido","romenig.candido@ibge.gov.br","3392136","quarta-feira"],
["ABT","Guilherme Silva Xavier de Souza","guilherme.xavier@ibge.gov.br","1100687","terça-feira"],
["ABT","Icaro Leandro Costa dos Santos Teixeira","icaro.teixeira@ibge.gov.br","3452834","terça-feira"],
["ABT","Joao Gabriel Martins da Cruz Moraes","joao.moraes@ibge.gov.br","3505895","terça-feira"]];

let apms=[],editId=null,podeEditar=false,modoLocal=false,versao=null,meta={},usuario="",senha="",proprietario=false,filtroDia="",ord={c:"",d:1},fila=Promise.resolve();
const novos=new Set();let LV=[];
const $=id=>document.getElementById(id),tb=$("tb"),menu=$("menu");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const opts=(arr,cur)=>arr.map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("");
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const fone=v=>{const d=String(v||"").replace(/\D/g,"").slice(0,11);if(!d)return"";let t="("+d.slice(0,2);if(d.length>2)t+=") "+d.slice(2,7);if(d.length>7)t+="-"+d.slice(7);return t};
const sz=v=>Math.max(8,String(v||"").length+1);
const ordem=l=>[...l].sort((x,y)=>DIAS.indexOf(x)-DIAS.indexOf(y));
const st=t=>$("st").textContent=t;
const normaliza=l=>{const r=(Array.isArray(l)?l:[]).map(a=>({id:a.id||uid(),ag:AG,nome:a.nome||"",email:a.email||"",contato:fone(a.contato),siape:String(a.siape||""),dias:ordem(Array.isArray(a.dias)?a.dias:(a.dia?[a.dia]:[])),cor:/^#[0-9a-f]{6}$/i.test(a.cor||"")?a.cor.toLowerCase():""}));
  const us=new Set(r.map(x=>x.cor).filter(Boolean));r.forEach((x,i)=>{if(!x.cor){const c=corLivre(us);x.cor=c;us.add(c)}});return r};
const hsl2hex=(h,s,l)=>{s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return"#"+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,"0")).join("")};
const corLivre=us=>{const c=PAL.find(p=>!us.has(p));if(c)return c;for(let i=0;i<720;i++){const x=hsl2hex((i*137.5)%360,60,45);if(!us.has(x))return x}return PAL[0]};
const corNova=()=>corLivre(new Set(apms.map(a=>a.cor)));
function semente(){return normaliza(SEED.filter(r=>r[0]===AG).map(r=>P(...r)))}

/* Dados no Supabase */
async function carregar(){
  const{data,error}=await sb.from("escala_agencia").select("dados,atualizado_em,atualizado_por").eq("agencia",AG).maybeSingle();
  if(error){st("Erro ao carregar");return}
  if(data){apms=normaliza(data.dados);versao=data.atualizado_em;meta=data}
  else{if(versao!==null||!apms.length)apms=semente();versao=null;meta={}}
  render();
}
async function _salvar(){
  if(!podeEditar)return false;
  st("Salvando…");
  const r=await sb.rpc("escala_salvar",{p_agencia:AG,p_dados:apms,p_versao:versao,p_senha:senha});
  if(r.error){
    const m=r.error.message||"";
    if(m.includes("SENHA_INVALIDA")){podeEditar=false;senha="";alert("A senha está incorreta ou foi alterada. A edição foi bloqueada; informe a senha novamente.")}
    else if(m.includes("CONFLITO"))alert("Outra pessoa alterou a escala enquanto você editava. Vou recarregar a versão mais recente; refaça a sua alteração.");
    else alert("Não foi possível salvar: "+m);
    editId=null;await carregar();st("");return false;
  }
  versao=r.data;meta={atualizado_em:versao,atualizado_por:usuario};st("Salvo");setTimeout(()=>st(""),1500);return true;
}
const salvar=()=>fila=fila.then(_salvar);

/* Filtros, ordenação e tela */
function filtrados(comDia){
  return apms.filter(a=>a.id===editId||(!comDia||!filtroDia||a.dias.includes(filtroDia)));
}
function ordenados(l){
  const c=ord.c||"nome",v=a=>c==="dias"?(a.dias.length?DIAS.indexOf(a.dias[0]):9):norm(a[c]);
  return [...l].sort((x,y)=>{const A=v(x),B=v(y);let r=A<B?-1:A>B?1:0;if(ord.c)r*=ord.d;return r||x.nome.localeCompare(y.nome,"pt")});
}
function render(){
  const L=ordenados(filtrados(true));LV=L;
  tb.innerHTML=L.length?L.map(a=>{
    const ed=a.id===editId,dl=DIAS.filter(d=>!a.dias.includes(d));
    const cell=(f,v)=>ed?`<input data-f="${f}" size="${sz(v)}" value="${esc(v)}">`:esc(v);
    const dias=a.dias.map(d=>`<div class="b"><span>${d}</span>${ed?`<button title="Remover dia" data-rmd="${d}">×</button>`:""}</div>`).join("");
    return`<tr class="${a.ag}${ed?" ed":""}" data-id="${a.id}">
<td>${ed?`${cell("nome",a.nome)}<br><label class="cf">Cor de fundo <input type="color" data-f="cor" value="${a.cor}"></label>`:`<span class="sw" style="background:${a.cor}"></span>${esc(a.nome)}`}</td><td>${cell("email",a.email)}</td><td>${ed?`<input data-f="contato" inputmode="tel" maxlength="15" size="16" placeholder="(##) #####-####" value="${esc(a.contato)}">`:esc(a.contato)}</td><td>${cell("siape",a.siape)}</td>
<td>${dias}${ed&&dl.length?`<select data-f="addd"><option value="">+ adicionar dia</option>${opts(dl)}</select>`:""}</td></tr>`}).join("")
    :`<tr><td colspan="5">Nenhum servidor encontrado.</td></tr>`;
  $("qt").textContent=apms.length+(apms.length===1?" servidor":" servidores");
  const base=filtrados(false);
  $("dias").innerHTML=DIAS.map(d=>{const n=base.filter(a=>a.dias.includes(d)).length;
    return`<button data-d="${d}" class="${filtroDia===d?"on":""}${n?"":" zero"}" title="Filtrar por este dia">${d.split("-")[0]} <b>${n}</b></button>`}).join("");
  document.querySelectorAll("th.s").forEach(th=>th.textContent=th.dataset.l+(ord.c===th.dataset.c?(ord.d>0?" ▲":" ▼"):""));
  const a=apms.find(x=>x.id===editId);
  $("ht").textContent=a?`Editando ${a.nome||"novo servidor"}. Clique fora da linha ou pressione Esc para concluir.`
    :modoLocal?"Modo local sem login: somente leitura."
    :podeEditar?"Edição liberada. Clique com o botão direito do mouse para editar, excluir ou adicionar servidores (na tabela de cima, também para escolher o servidor de cada dia)."
    :"Tabelas travadas. Clique com o botão direito do mouse e informe a senha para editar.";
  render2();ajusta();
}
/* Tabela 2: quadro semanal (Agência x dias). Sempre gerada a partir dos mesmos dados da tabela 1 */
const porAg=l=>[...l].sort((x,y)=>x.ag.localeCompare(y.ag)||x.nome.localeCompare(y.nome,"pt"));
function render2(){
  const A=porAg(apms),col=DIAS.map(d=>A.filter(a=>a.dias.includes(d)));
  const n=Math.max(8,...col.map(c=>c.length));
  $("h2").innerHTML=DIAS.map(d=>`<th${filtroDia===d?' class="fd"':""}>${d}</th>`).join("");
  let h="";
  for(let i=0;i<n;i++)h+="<tr>"+DIAS.map((d,j)=>{const a=col[j][i];
    return`<td data-d="${d}" data-i="${i}"${a?` data-id="${a.id}"`:""} class="${a?"f ":""}${filtroDia===d?"fd":""}"${a?` style="background:${a.cor};color:${txt(a.cor)}"`:""}>${a?esc(a.nome||"(sem nome)"):""}</td>`}).join("")+"</tr>";
  $("tb2").innerHTML=h;
}
/* Transforma a célula da tabela superior numa lista com todos os servidores */
function escolher(td){
  const d=td.dataset.d,atual=td.dataset.id||"";
  const op=porAg(apms).filter(a=>a.id===atual||!a.dias.includes(d));
  td.innerHTML=`<select class="pick" data-d="${d}" data-old="${atual}"><option value="">${atual?"(remover deste dia)":"— escolher servidor —"}</option>${op.map(a=>`<option value="${a.id}"${a.id===atual?" selected":""}>${esc(a.nome||"(sem nome)")} (${a.ag})</option>`).join("")}</select>`;
  const sl=td.firstChild;sl.focus();try{sl.showPicker()}catch(e){}
}
$("tb2").addEventListener("change",async e=>{
  const sl=e.target;if(!sl.classList.contains("pick"))return;
  const d=sl.dataset.d,old=sl.dataset.old,nv=sl.value;
  if(nv===old){render2();return}
  const ao=apms.find(a=>a.id===old),an=apms.find(a=>a.id===nv);
  if(ao)ao.dias=ao.dias.filter(x=>x!==d);
  if(an&&!an.dias.includes(d))an.dias=ordem([...an.dias,d]);
  await salvar();render();
});
$("tb2").addEventListener("focusout",e=>{const sl=e.target;if(sl.classList&&sl.classList.contains("pick")&&sl.value===sl.dataset.old)render2()});
/* Tabela superior com tamanho fixo: cabeçalho + 8 linhas (acima disso, rola por dentro) */
function ajusta(){
  const w=$("w2"),r=$("tb2").rows[0];if(!r)return;
  w.style.height=($("t2").tHead.offsetHeight+r.offsetHeight*8+1)+"px";
}
addEventListener("resize",ajusta);
$("dias").onclick=e=>{const b=e.target.closest("button");if(!b)return;filtroDia=filtroDia===b.dataset.d?"":b.dataset.d;render()};
$("t1").querySelector("thead").onclick=e=>{const c=e.target.dataset.c;if(!c)return;
  if(ord.c!==c)ord={c,d:1};else if(ord.d===1)ord.d=-1;else ord={c:"",d:1};render()};

/* Edição (só pelo botão direito, só para editores) */
async function endEdit(){
  if(!editId)return;
  const a=apms.find(x=>x.id===editId),id=editId;editId=null;
  if(a&&!a.nome&&!a.email&&!a.contato&&!a.siape){apms=apms.filter(x=>x!==a);if(!novos.has(id))await salvar()}
  novos.delete(id);render();
}
function abrir(id){editId=id;render();const i=tb.querySelector("tr.ed input[data-f=nome]");if(i)i.focus()}
const find=el=>apms.find(a=>a.id===el.closest("tr").dataset.id);
tb.addEventListener("input",e=>{const t=e.target;if(t.tagName!=="INPUT"||t.type==="color")return;if(t.dataset.f==="contato"){t.value=fone(t.value);return}t.size=sz(t.value)});
tb.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.tagName==="INPUT"){e.target.blur();endEdit()}});
tb.addEventListener("change",async e=>{
  const f=e.target.dataset.f;if(!f)return;const a=find(e.target),v=e.target.value;
  if(f==="contato"){const d=v.replace(/\D/g,"");if(d.length&&d.length!==11){alert("Informe o telefone completo no formato (##) #####-####, somente números.");e.target.value=a.contato;return}a.contato=fone(v)}
  else if(f==="cor"){const c=v.toLowerCase(),dup=apms.find(x=>x!==a&&x.cor===c);if(dup){alert("Essa cor já é usada por "+(dup.nome||"outro servidor")+". Escolha outra.");e.target.value=a.cor;return}a.cor=c}
  else if(f==="addd"){if(v&&!a.dias.includes(v))a.dias=ordem([...a.dias,v])}else a[f]=v.trim();
  if(await salvar())novos.delete(a.id);
  if(f==="addd"||f==="ag")render();else{render2();ajusta()}
});
tb.addEventListener("click",async e=>{
  const t=e.target;if(!(t instanceof HTMLButtonElement)||t.dataset.rmd===undefined)return;
  const a=find(t);a.dias=a.dias.filter(d=>d!==t.dataset.rmd);await salvar();render();
});
const mostrarMenu=(e,html)=>{
  menu.innerHTML=html;menu.style.display="block";
  menu.style.left=Math.min(e.clientX,innerWidth-menu.offsetWidth-8)+"px";
  menu.style.top=Math.min(e.clientY,innerHeight-menu.offsetHeight-8)+"px";
};
function menuEdicao(e){
  const cel=e.target.closest("#t2 td[data-d]"),tr=e.target.closest("#tb tr[data-id]");
  const id=cel?(cel.dataset.id||""):(tr?tr.dataset.id:"");
  let h="";
  if(cel){const d=cel.dataset.d;h=`<button data-act="pick" data-d="${d}" data-i="${cel.dataset.i}">Escolher servidor para ${d}</button>`+(id?`<button class="d" data-act="rmdia" data-id="${id}" data-d="${d}">Remover da ${d}</button>`:"")}
  mostrarMenu(e,h+(id?`<button data-act="edit" data-id="${id}">Editar servidor</button><button class="d" data-act="del" data-id="${id}">Excluir servidor</button>`:"")+`<button data-act="add">Adicionar servidor</button>`+(proprietario?`<button data-act="senha">Alterar senha da escala</button>`:""));
}
/* Senha de edição (verificada no Supabase; nunca fica guardada na página) */
function pedirSenha(titulo){return new Promise(res=>{
  const o=document.createElement("div");o.id="ovs";
  o.innerHTML=`<form class="dlg"><b>${esc(titulo)}</b><input type="password" autocomplete="off" required><div><button type="button" class="cancel">Cancelar</button><button type="submit">OK</button></div></form>`;
  document.body.appendChild(o);
  const i=o.querySelector("input"),fim=v=>{o.remove();res(v)};
  o.querySelector("form").onsubmit=ev=>{ev.preventDefault();fim(i.value)};
  o.querySelector(".cancel").onclick=()=>fim(null);
  o.addEventListener("keydown",ev=>{if(ev.key==="Escape"){ev.stopPropagation();fim(null)}});
  i.focus();
})}
async function desbloquear(){
  const v=await pedirSenha("Informe a senha para editar a escala "+AG);
  if(!v)return false;
  const{data,error}=await sb.rpc("escala_verificar",{p_agencia:AG,p_senha:v});
  if(error||data!==true){alert(error?"Não foi possível verificar a senha: "+error.message:"Senha incorreta.");return false}
  senha=v;podeEditar=true;return true;
}
async function trocarSenha(){
  const n1=await pedirSenha("Nova senha da escala "+AG+" (mínimo 4 caracteres)");
  if(!n1)return;
  if(n1.length<4)return alert("A senha precisa ter pelo menos 4 caracteres.");
  const n2=await pedirSenha("Repita a nova senha");
  if(n2!==n1)return alert("As senhas não conferem. Nada foi alterado.");
  const{error}=await sb.rpc("escala_trocar_senha",{p_agencia:AG,p_nova:n1});
  if(error)return alert("Não foi possível alterar a senha: "+error.message);
  if(podeEditar)senha=n1;
  alert("Senha da escala "+AG+" alterada.");
}
document.querySelector(".painel").addEventListener("contextmenu",async e=>{
  if(!e.target.closest(".w2,.wrap"))return;
  if(modoLocal)return;
  e.preventDefault();
  if(!podeEditar){
    if(proprietario){mostrarMenu(e,`<button data-act="liberar">Liberar edição (senha)</button><button data-act="senha">Alterar senha da escala</button>`);return}
    if(!await desbloquear())return;
    render();
  }
  menuEdicao(e);
});
menu.addEventListener("click",async e=>{
  const b=e.target.closest("button");if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;menu.style.display="none";
  if(act==="liberar"){if(await desbloquear())render();return}
  if(act==="senha"){await trocarSenha();return}
  await endEdit();await carregar();
  if(act==="edit"){if(apms.some(x=>x.id===id))abrir(id)}
  else if(act==="del"){const a=apms.find(x=>x.id===id);
    if(a&&confirm("Excluir "+(a.nome||"este servidor")+" da escala?")){apms=apms.filter(x=>x!==a);await salvar();render()}}
  else if(act==="addia"||act==="rmdia"){const a=apms.find(x=>x.id===id),d=b.dataset.d;
    if(a&&d){a.dias=act==="addia"?ordem([...new Set([...a.dias,d])]):a.dias.filter(x=>x!==d);await salvar();render()}}
  else if(act==="pick"){const td=$("tb2").querySelector(`td[data-d="${b.dataset.d}"][data-i="${b.dataset.i}"]`);if(td)escolher(td)}
  else if(act==="add"){const n={id:uid(),ag:AG,nome:"",email:"",contato:"",siape:"",dias:[],cor:corNova()};apms.push(n);novos.add(n.id);abrir(n.id)}
});
document.addEventListener("click",e=>{
  if(!e.target.closest("#menu"))menu.style.display="none";
  if(editId&&!e.target.closest("tr.ed")&&!e.target.closest("#menu"))endEdit();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){menu.style.display="none";endEdit();render2()}});
addEventListener("scroll",()=>menu.style.display="none",true);
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&!editId&&!modoLocal)carregar()});

/* Voltar: retorna à página que já estava aberta (não abre outra cópia) */
$("voltar").addEventListener("click",e=>{
  e.preventDefault();
  if(history.length>1){history.back();return}
  window.close();
  setTimeout(()=>{let r="";try{const u=new URL(document.referrer);if(u.origin===location.origin)r=u.href}catch(_){}location.href=r||"painel.html"},400);
});

/* Início: login obrigatório, permissões e dados */
(async()=>{
  const liberar=()=>{const g=$("guarda-css");if(g)g.remove()};
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(!session){
      if(noGit)return location.replace("index.html");
      modoLocal=true;apms=semente();liberar();render();return;
    }
    const{data:p}=await sb.from("perfis").select("aprovado").eq("id",session.user.id).maybeSingle();
    if(!p||p.aprovado!==true)return location.replace("index.html");
    usuario=session.user.email||"";
    const{data:ed}=await sb.from("escala_editores").select("email").maybeSingle();
    proprietario=!!ed;
    await carregar();
    liberar();render();
  }catch(e){liberar();st("Erro de conexão");render()}
})();
</script>
